name: Deploy Piano Tutor PWA

# Deployment is intentionally manual in the fork. The upstream workflow
# force-pushed version-bump commits and tags on every main-branch push, which is
# unsafe for a portfolio fork and for a remote that may still point upstream.
on:
  workflow_dispatch:
    inputs:
      base_path:
        description: "Vite base path, for example /piano_tutor/ or / for a custom domain"
        required: true
        default: "/piano_tutor/"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check public-release boundary
        run: python3 scripts/check_public_tree.py --history

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            backend/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build WASM module
        working-directory: backend
        run: wasm-pack build --target web --out-dir pkg --release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Copy WASM artifacts
        run: |
          mkdir -p frontend/public/wasm
          cp backend/pkg/musicore_backend_bg.wasm frontend/public/wasm/
          cp backend/pkg/musicore_backend.js frontend/public/wasm/

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BASE: ${{ inputs.base_path }}
        run: npm run build

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
